[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shi-swarm"
version = "0.0.1"
description = "势 / Shi — 无中枢决策系统研究：不改造个体，只设计环境"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shi Project" }]
keywords = ["swarm", "stigmergy", "self-organization", "emergence", "multi-agent"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Life",
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
speed = ["numba>=0.58"]
plot = ["matplotlib>=3.7"]
analysis = ["scipy>=1.10", "pandas>=2.0"]
dev = ["pytest>=7.4", "ruff>=0.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/shi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
